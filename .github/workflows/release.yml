name: Release SDK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: python3 eng/generate_abi100.py --verify
      - run: python3 -m unittest discover -s eng -p "test_*.py"
      - run: python3 eng/verify_docs.py
      - run: dotnet build NexaCL-Plugin-SDK.slnx -c Release
      - run: dotnet run --project tests/Nexa.Plugin.Sdk.Tests -c Release --no-build
      - run: python3 eng/build_wasm_sample.py
      - run: dotnet publish tests/Nexa.Plugin.Sdk.AotSmoke -c Release -r linux-x64 -p:PublishAot=true -o artifacts/aot
      - run: artifacts/aot/Nexa.Plugin.Sdk.AotSmoke
      - run: dotnet pack src/Nexa.Plugin.Bootstrap.V1 -c Release -o artifacts/packages
      - run: dotnet pack src/Nexa.Plugin.Sdk.Abi100 -c Release -o artifacts/packages
      - run: python3 eng/package_sdk.py && python3 eng/bundle_sdk.py
      - name: Publish immutable SDK inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          directory=Path('artifacts/packages');release=json.loads((directory/'sdk.release.json').read_text())
          subprocess.run(['gh','release','create',release['release'],*map(str,sorted(directory.glob('*.nupkg'))),*map(str,sorted(directory.glob('*.zip'))),str(directory/'sdk.release.json'),'--prerelease','--latest=false','--target','${{ github.sha }}','--title','NexaCL Plugin SDK '+release['version'],'--notes','Independent Bootstrap/ABI 100 authoring SDK, C/Wasm bindings, detailed reference and examples. Existing Nexa ABI 100 contracts are preserved; legacy PCL plugins require porting.'],check=True)
          PY
