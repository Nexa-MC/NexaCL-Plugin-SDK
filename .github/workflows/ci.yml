name: SDK CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python eng/generate_abi100.py --verify
      - run: python -m unittest discover -s eng -p "test_*.py"
      - run: python eng/verify_docs.py
      - run: dotnet build NexaCL-Plugin-SDK.slnx -c Release
      - run: dotnet run --project tests/Nexa.Plugin.Sdk.Tests -c Release --no-build
      - run: dotnet publish tests/Nexa.Plugin.Sdk.AotSmoke -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/aot
      - shell: pwsh
        run: |
          $binary = if ($IsWindows) { './artifacts/aot/Nexa.Plugin.Sdk.AotSmoke.exe' } else { './artifacts/aot/Nexa.Plugin.Sdk.AotSmoke' }
          & $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: python3 eng/build_wasm_sample.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install wasmtime==39.0.0
      - run: python3 eng/verify_guest_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: executable-wasm-examples
          path: artifacts/wasm-sample/*.zip
